<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Installable app (web/public/manifest.webmanifest, web/public/sw.js): on a
      phone, "Add to Home screen" opens Khozo full screen at /report, and the
      pages a citizen needs keep opening without a signal.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#67a426" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Khozo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      Gujarati and Devanagari faces for the translated interface; Latin falls
      through to the existing stack. Loaded without blocking the first paint:
      on a weak signal the page shows in the system font at once and swaps
      when the faces arrive, instead of staying blank while Google answers.
      Fetched in CORS mode (crossorigin) so the face files it pulls in are
      visible to web/src/pwa.js, which has the service worker keep them for
      offline use.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" crossorigin href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Sans+Gujarati:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Sans+Gujarati:wght@400;500;600;700;800&display=swap" /></noscript>
    <meta name="description" content="Seen a child who may be missing? Send a photo from your phone in under a minute — free, no login. An officer checks every report before any family is contacted." />
    <title>Khozo — Help a missing child return home</title>
    <!--
      Share preview for WhatsApp, Facebook, LinkedIn and X. Without these a
      shared link showed only the bare domain. Absolute URLs, because crawlers
      do not resolve relative ones; the image is 1200x630 and well under the
      300 KB WhatsApp drops images above (scripts/make-share-image.mjs).
      Every page, /child/* included, previews with this same card: Khozo never
      puts a missing person's name or photo into a share preview.
    -->
    <!-- share:start -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Khozo" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Khozo — Help a missing child return home" />
    <meta property="og:description" content="Seen a child who may be missing? Send a photo from your phone in under a minute — free, no login. An officer checks every report before any family is contacted." />
    <meta property="og:image" content="https://khozo.org/assets/share-default.jpg?v=2" />
    <meta property="og:image:secure_url" content="https://khozo.org/assets/share-default.jpg?v=2" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Khozo: Seen a child who may be missing? Send a photo from your phone in under a minute." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Khozo — Help a missing child return home" />
    <meta name="twitter:description" content="Seen a child who may be missing? Send a photo from your phone in under a minute — free, no login. An officer checks every report before any family is contacted." />
    <meta name="twitter:image" content="https://khozo.org/assets/share-default.jpg?v=2" />
    <!-- share:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
